#
# mesh — the RoboHub Mesh application.
#
# It is a keeper-hosted application: it runs on its own HTTP port, standalone or
# launched by the keeper. The `application` block is what tells the keeper that
# this module is a hosted application rather than a service like the docsite or
# the keeper itself.
#
module:
  name: mesh
  id: robohub.app.mesh
  previous_ids:
    - robohub.applications.mesh
  type: rho
  kind: keeper-hosted
  title: RoboHub Mesh
  route: /mesh
  port: 8478
  command: mesh
  version: 0.18.6
  author: Aurel Miron
  maintainer: Aurel Miron
  license: "MIT"
description: >
  Plans and runs RoboHub gateway deployments: projects, a gateway and its
  nodes, the network between them, and the firmware on their boards.

platform: robohub

main: src/main.rho

# The host ports that supply the foreign functions Mesh declares: docs_* from the
# documentation store, telemetry_* from the RoboHub integration's telemetry port.
ports:
  - docstore
  - telemetry

build:
  language: go
  targets:
    - go-server

# Mesh owns the telemetry store other applications read. The schema is
# declarative because the port that ingests a gateway's outbox writes the rows
# it declares, and the sql port embeds it so the database is created by the
# same reading of the same file.

requires:
  - name: rho/sqlite

sql:
  driver: rho-sql-sqlite
  schema: db/schema.sql
  out: src/db

# The application's own files, embedded when it is built.
assets:
  - module.yml
  - docs/index.md
  - locales/phrases.ro.txt

deps:
  rho-log: ">=0.1.2"
  robohub:
    logging: ">=0.1.0"
    htmx: ">=0.1.0"
    i18n: ">=0.4.0"
    settings: ">=0.1.0"
    forms: ">=0.1.0"
    notifications: ">=0.1.0"
    ui: ">=0.1.1"
    robohub-bus: ">=0.2.0"
    robohub-provider-mqtt: ">=0.2.0"
    robohub-auth: ">=0.1.0"
    robohub-alert: ">=1.0.0"
    robohub-provider-log: ">=0.2.0"
    robohub-provider-email: ">=0.2.0"
    robohub-provider-telegram: ">=0.2.0"
  rho-sql: ">=0.1.0"

# A hosted application is not a service the keeper is: it has its own listener,
# its own lifetime and its own command. The keeper reads this block to offer it
# in its applications registry.

# The plugins this application uses: how it signs a person in.
plugins:
  - name: robohub-auth
    enabled: true
    config:
      issuer: keeper
      mode: direct
      login_url: "http://127.0.0.1:19090/auth/login"

# The alert channels Mesh raises its alerts through, and their settings. The
# Settings page changes them on a running installation (bind.conf in Mesh's
# workspace, or ~/.rho/apps/mesh when it is started by hand); these are the
# defaults.
# The bus reaches MQTT devices: the broker the keeper runs (robohub-mqtt), as the
# broker user the keeper made for Mesh.
bus:
  publish: [+/rpc, mesh/+/telemetry]
  subscribe: [+/status/#, +/online]

bind:
  robohub.bus:
    providers:
      - robohub-provider-mqtt
  robohub.alert:
    providers:
      - robohub-provider-log
      - robohub-provider-email
      - robohub-provider-telegram
    config:
      robohub-provider-log:
        path: "~/.rho/mesh/alerts.log"
        severity_threshold: INFO
      robohub-provider-email:
        enabled: "false"
        mode: local
        from_address: "alerts@robohub.internal"
        to_address: "ops@robohub.internal"
        subject_template: "[RoboHub {app}] {level}: {rule}"
        body_template: "{message}"
        severity_threshold: ERROR
      robohub-provider-telegram:
        enabled: "false"
        severity_threshold: WARNING

deploy:
  port: 8478
  service: mesh
  # The services it calls; keeper registers it as a client for these alone.
  calls: [gateway, energy]

docs:
  title: The RoboHub Mesh application
  section: applications
  order: "31"
  index: docs/index.md
  sources:
    - docs/index.md

# What Mesh needs from the machine. Firmware for a board is built and flashed
# through rho-target and the board's platform, which declare their own toolchains;
# these are what Mesh itself runs.
system_deps:
  executables:
    - name: curl
      description: gateways and devices are asked with it
      install:
        apt: curl
        brew: curl
    - name: openssl
      description: the keys of gateways and links are made with it
      install:
        apt: openssl
        brew: openssl
    - name: flock
      description: one job at a time per mesh
      install:
        apt: util-linux
        brew: flock
    - name: ssh
      description: a gateway on another host is reached with it
      required: false
      install:
        apt: openssh-client
        brew: openssh
