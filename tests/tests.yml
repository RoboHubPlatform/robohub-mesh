# The Mesh application's test suites.
#
# A suite is declared rather than discovered: the Rho unit tests check the
# string helpers and the domain (the plan as text, transports, the impact table,
# the project file's rules), and the smoke suites build Mesh and walk the
# application over HTTP, including the event stream that reports a long action.

name: mesh
suites:
  - name: tests/wizard_test.rho
    kind: rho
    tags: [unit, rho]
  - name: tests/domain_test.rho
    kind: rho
    tags: [unit, rho, domain]
  # The project file's rules: the allow-list, the YAML line check, the classes,
  # schema versions, every problem and the import's decisions.
  - name: tests/project_file_test.rho
    kind: rho
    tags: [unit, rho, domain, transfer]
  # @verifies MESH-0001, MESH-0003, MESH-0008, MESH-0012, MESH-0013, MESH-0015, MESH-0016, MESH-0017, MESH-0018, MESH-0019, MESH-PLAN-0001, MESH-PLAN-0002, MESH-PLAN-0003, MESH-PLAN-0004, MESH-PLAN-0005, MESH-PLAN-0007, MESH-BUILD-0002, MESH-BUILD-0003, MESH-BUILD-0004, MESH-BUILD-0005, MESH-BUILD-0006, MESH-BUILD-0007, MESH-BUILD-0008, MESH-ACCESS-0002, MESH-API-0001, MESH-API-0003, MESH-API-0004, MESH-FLEET-0001, MESH-FLEET-0002, MESH-FLEET-0003, MESH-FLEET-0004, MESH-FLEET-0005, MESH-FLEET-0006, MESH-UI-0001, MESH-UI-0002, MESH-UI-0003, MESH-UI-0004, MESH-UI-0005
  - name: wizard-smoke
    kind: command
    tags: [smoke]
    command: [python3, tests/wizard_smoke.py]
  # Owner-only folders, the node manifest, revoking, rotating, and host nodes
  # fetching their key.
  # @verifies MESH-0002, MESH-0005, MESH-0006, MESH-0007, MESH-0008, MESH-ACCESS-0001, MESH-ACCESS-0002, MESH-ACCESS-0003, MESH-ACCESS-0004, MESH-ACCESS-0005, MESH-ACCESS-0006, MESH-ACCESS-0008, MESH-ACCESS-0009
  - name: security-smoke
    kind: command
    tags: [smoke, security]
    command: [python3, tests/security_smoke.py]
  # Production builds with a stand-in rho: nothing is built or burned.
  # @verifies MESH-0004, MESH-0008, MESH-BUILD-0009, MESH-BUILD-0010, MESH-BUILD-0011
  - name: production-smoke
    kind: command
    tags: [smoke, security, production]
    command: [python3, tests/production_smoke.py]
  # Who may reach what in a running Mesh: the public routes, every other route
  # class refused without a ticket, /mesh/api's token scopes, a gateway's token,
  # standalone mode and the kept copy of the keeper's public key.
  # @verifies MESH-0011, MESH-0012, MESH-0013, MESH-0020, MESH-API-0001, MESH-API-0002, MESH-API-0006, MESH-API-0007, MESH-API-0008, MESH-XFER-0024, MESH-0028
  - name: access-smoke
    kind: command
    tags: [smoke, security, access]
    command: [python3, tests/access_smoke.py]
  # Devices, alerts and paths, with the state folder's path holding a space and a
  # stand-in Shelly plug: a switch confirmed only by what the plug reports
  # (pending, then unconfirmed, when its relay sticks), a gateway outage and an
  # unsent revocation raised as one alert each through the log provider, and a
  # mesh created, saved and deleted without touching a folder named like the
  # path's first word; and a stand-in Tasmota plug on a broker of the smoke's own,
  # holding Mesh to its manifest's broker grants: four topics merged into one
  # reading, a switch confirmed only by stat/RESULT or stat/POWER, a stuck relay
  # pending then unconfirmed, a refused word kept out, LWT Offline unreachable.
  # @verifies MESH-0014, MESH-0022, MESH-0023, MESH-0024, MESH-API-0010, MESH-0029, MESH-0030, MESH-0031, MESH-0032, MESH-0038, MESH-0039, MESH-0040
  - name: devices-smoke
    kind: command
    tags: [smoke, devices, alerts]
    command: [python3, tests/devices_smoke.py]
  # The telemetry store's own tests, against a real SQLite database with Mesh's
  # schema and a stand-in gateway: ingest once per gateway and sequence, series
  # keying, roll-up and retention; and a device's fields merged from the
  # messages it published (topics newest first, `$`, onoff, the Shelly topic).
  # @verifies MESH-TEL-0001, MESH-TEL-0002, MESH-TEL-0004, MESH-TEL-0005, MESH-TEL-0006, MESH-0029, MESH-0030, MESH-0031, MESH-ZB-0014
  - name: telemetry-store
    kind: command
    tags: [unit, go, telemetry]
    command: [go, -C, plugins/mesh-telemetry/ports, test, -count=1, ./...]
  # The project file's published schema and Mesh's own rules, held together:
  # the same keys at the same places, the same class for each, and every sample
  # value taken or refused alike.
  # @verifies MESH-XFER-0006, MESH-ZB-0016
  - name: project-schema
    kind: command
    tags: [unit, transfer, schema]
    command: [python3, tests/project_schema_test.py]
  # The projectfile port's own tests: sealing round trips and fails closed
  # (wrong passphrase, altered ciphertext, other associated data or parameters),
  # JSON read as flat lines and refused where they cannot hold it, flat lines
  # written as sorted JSON, the digest, and a port that touches no file.
  # @verifies MESH-XFER-0004, MESH-XFER-0005, MESH-XFER-0010, MESH-XFER-0011, MESH-XFER-0012, MESH-XFER-0020, MESH-0026
  - name: projectfile-port
    kind: command
    tags: [unit, go, transfer]
    command: [go, -C, plugins/mesh-projectfile/ports, test, -count=1, ./...]
  # The fwupdate port's own tests: a key and its public half, an update manifest
  # laid out as PROTO-0008 says and signed over "rh-update1" and its bytes, bad
  # arguments refused, the header carrying the key.
  # @verifies MESH-0039, MESH-0040
  - name: fwupdate-port
    kind: command
    tags: [unit, go, updates]
    command: [go, -C, plugins/mesh-update/ports, test, -count=1, ./...]
  # Exporting and importing over HTTP, across several running Meshes: what a
  # file carries, sealed secrets, the three modes, conflicts, the preview, an
  # overwrite, invalid files, grants and form tokens, the pages, and an import
  # interrupted before its rename. The script tags each requirement it proves.
  - name: project-file-smoke
    kind: command
    tags: [smoke, transfer, security]
    command: [python3, tests/project_file_smoke.py]
  # Zigbee coordinators over HTTP, with a broker, a keeper and a Zigbee2MQTT of
  # the smoke's own and no serial port opened: placing a coordinator and the
  # refusals, its broker user, the configuration and the process, the bridge's
  # state, joining, adopting and renaming a plug, reading and switching it as an
  # MQTT device, the network sealed, carried and restored, and removing both.
  # @verifies MESH-ZB-0001, MESH-ZB-0002, MESH-ZB-0003, MESH-ZB-0004, MESH-ZB-0005, MESH-ZB-0006, MESH-ZB-0008, MESH-ZB-0009, MESH-ZB-0010, MESH-ZB-0011, MESH-ZB-0012, MESH-ZB-0013, MESH-ZB-0014, MESH-ZB-0015, MESH-ZB-0016, MESH-0033, MESH-0034, MESH-0035, MESH-0022
  - name: zigbee-smoke
    kind: command
    tags: [smoke, devices, zigbee]
    command: [python3, tests/zigbee_smoke.py]
  # Mesh run as the keeper runs it, beside a stand-in keeper offering the helpers
  # API (keeper KEEP-APPS-0020): a coordinator's Zigbee2MQTT and the gateway asked
  # for as helpers with the right definition, Mesh's App credential and no secret,
  # their state read from the keeper, stopped and removed through it, the
  # helper's log on the tab, and a restart of Mesh that stops nothing.
  # @verifies MESH-0037, MESH-ZB-0006, MESH-BUILD-0007, MESH-BUILD-0008
  - name: helpers-smoke
    kind: command
    tags: [smoke, helpers, zigbee]
    command: [python3, tests/helpers_smoke.py]
  # The whole chain on a board (MESH-0043, with MESH-0040 and MESH-0041): a Mesh
  # of its own builds robohub-node's template for a Pico 2 W, flashes it with the
  # A/B partition table, starts the gateway on the board's USB link, and updates
  # the board over that link until it confirms. It needs the board on USB and its
  # serial port free (no other gateway reading it), so it is declared skipped.
  # @verifies MESH-0043
  - name: update-chain-on-target
    kind: command
    tags: [on-target, pico2w, updates]
    command: [python3, tests/update_chain_on_target.py]
    status: skip
    reason: needs a Pico 2 W on USB with its serial port free; prints "OK" when Mesh built, flashed and updated it through the gateway
  # The settlement node on a board (robohub ADR-0026, as amended): a Mesh of its
  # own builds robohub-node's template for a Pico 2 W with its module fitted —
  # a GY-68 (BMP180) by default, an SHT4x with SETTLEMENT_MODULE=sht4x-module —
  # flashes it, starts the gateway on its USB link, and waits for plausible
  # readings through the gateway. Needs the board with the breakout wired to
  # GP8/GP9 and its serial port free, so it is declared skipped.
  # @verifies PICO-0015
  - name: settlement-on-target
    kind: command
    tags: [on-target, pico2w, sht4x]
    command: [python3, tests/settlement_on_target.py]
    status: skip
    reason: needs a Pico 2 W on USB with a GY-68 (or an SHT4x) on GP8/GP9 and its serial port free; prints "OK" when the node's readings arrive through the gateway
