# CI for this repository: the RoboHub workflow every repository in the
# ecosystem calls, so the steps are written once (robohub/.github/workflows).
#
# Mesh builds beside robohub, which carries the shared modules it declares under
# `deps: robohub:` and the registry of boards it plans with.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    uses: RoboHubPlatform/robohub/.github/workflows/robohub-ci.yml@main
    secrets: inherit
    with:
      # robohub-pico and robohub-linux: the boards a production build is
      # offered for (or not) are read from their platforms.
      # robohub-gateway: the wizard smoke builds and starts a real gateway.
      siblings: robohub robohub-drivers robohub-devices robohub-pico robohub-linux robohub-gateway
      components: rho-auth rho-log rho-sql rho-sql-sqlite rho-robohub
      build: .
      # The wizard smoke builds a real Pico 2W board, with rho-target's compiler.
      machine_install: rho-target:arm-none-eabi-gcc
