# What Mesh's go-server target has that the toolchain's built-in one does not.
# Everything else — the files, the kind, the router, the output folders — is the
# built-in target's.

targets:
  - id: go-server
    api:
      public_paths: "/, /mesh, /mesh/docs"
    middleware:
      # A form posted from another origin is refused before anything else:
      # keeper and the other applications are other ports of the same host,
      # which a SameSite cookie does not tell apart. Programs that post here
      # send no browser headers and are not affected.
      - name: same_origin
      - name: auth
        options:
          issuer: keeper
          # The overview and the documentation are the shop window; the API
          # that reads telemetry, devices and sensors is not.
          skip_paths: "/healthz,/auth/login,/assets,/assets/,/i18n,/auth/callback,/static,/mesh/docs"
    # Every file under templates/ is a template, named by its file name.
    templates:
      - dir: templates
    # A language is carried only once it is listed, so a catalog still being
    # translated stays out of the build.
    default_locale: en
    locales:
      - locale: en
        file: locales/en.json
      - locale: ro
        file: locales/ro.json
